name: Scoped work item
description: Propose a small change tied to a milestone and acceptance evidence.
title: ""
body:
  - type: textarea
    id: scenario
    attributes:
      label: Problem and scenario
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope, dependencies, and non-goals
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Use observable checkboxes.
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: Verification commands and expected evidence
    validations:
      required: true
